name: Tag version

on:
  push:
    branches:
      - main

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.push_tag.outcome == 'success' && steps.tag_exists.outputs.exists == 'false' }}
      tag: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "value=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_exists
        run: |
          if git ls-remote --tags origin "${{ steps.version.outputs.value }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        id: push_tag
        if: steps.tag_exists.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.value }}"
          git push origin "${{ steps.version.outputs.value }}"

  # Tag pushes made with GITHUB_TOKEN do not fire the release workflow's
  # `on: push: tags` trigger, so call it explicitly for new tags.
  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    # Reusable (workflow_call) workflows do NOT inherit repo secrets by default —
    # without this, release.yml's amo job would never see AMO_JWT_ISSUER/SECRET
    # and would silently self-skip forever, even after the secrets are added.
    secrets: inherit
    with:
      tag: ${{ needs.tag.outputs.tag }}
